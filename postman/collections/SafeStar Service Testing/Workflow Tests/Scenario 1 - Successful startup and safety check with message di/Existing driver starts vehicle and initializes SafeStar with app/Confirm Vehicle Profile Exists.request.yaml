$kind: http-request
url: "{{baseUrl}}/vehicle/:id"
method: GET
pathVariables:
  id: "{{vehicleID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |
      const vinDecode = pm.require('npm:vin-decode@0.2.0');
      const qaWorkshopPackage = pm.require('@postvehicle-enterprise-team-59d1fca9-a977-4bd2-80da-6a3526be/qa_workshop_package');
      pm.test("VIN is a validly-formatted string", function () {
          var jsonData = pm.response.json();
          console.log("Checking VIN: " + jsonData.vehicle.vin + " ...");
          pm.expect(jsonData.vehicle.vin).to.be.a.string;
          pm.expect(qaWorkshopPackage.isValidVIN(jsonData.vehicle.vin)).to.be.true;
          console.log("Decoding a vin ....");
          console.log(vinDecode(jsonData.vehicle.vin).decode());
      });
    language: text/javascript
    packages:
      npm:vin-decode@0.2.0:
        id: npm:vin-decode@0.2.0
      "@postvehicle-enterprise-team-59d1fca9-a977-4bd2-80da-6a3526be/qa_workshop_package":
        id: 01a0ec37-614b-7baa-86ed-4aaa4a27102a
  - type: beforeRequest
    code: ""
    language: text/javascript
order: 2000
